[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tatmaq-analytics-core"
version = "0.1.0"
description = "Deterministic calculation engine for TATMAQ Intelligence: cleaning, statistics, financial maths and validation."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=3.0",
    "scipy>=1.14",
    "statsmodels>=0.14",
]

[tool.setuptools.packages.find]
include = ["analytics_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
