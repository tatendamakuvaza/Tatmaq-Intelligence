[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tatmaq-api"
version = "0.1.0"
description = "TATMAQ Intelligence API, agent orchestration and background worker."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "langgraph>=1.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
    "pandas>=3.0",
    "numpy>=2.0",
    "scipy>=1.14",
    "statsmodels>=0.14",
    "openpyxl>=3.1",
    "pyarrow>=17",
    "reportlab>=4.2",
    "tatmaq-analytics-core",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:reportlab.*"]
